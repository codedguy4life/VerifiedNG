name: VerifiedNG quality checks

on:
  push:
    branches:
      - feature/community-home-redesign
  pull_request:

jobs:
  frontend-build:
    name: React production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend-check:
    name: Backend syntax and integration tests
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      JWT_SECRET: verifiedng_ci_test_secret_not_for_production
      FRONTEND_URL: http://localhost:5173
      MONGO_TEST_URI: mongodb://127.0.0.1:27017/verifiedng_ci_test
      MONGO_URI: mongodb://127.0.0.1:27017/verifiedng_ci_app
      PROVIDER_INVITE_CODE: verifiedng_ci_test_provider_invite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install backend dependencies
        run: npm ci
      - name: Check backend syntax
        run: |
          node --check src/index.js
          node --check src/controllers/communityController.js
          node --check src/controllers/localNewsController.js
          node --check src/controllers/userController.js
      - name: Run integration tests against isolated CI MongoDB
        run: npm test
